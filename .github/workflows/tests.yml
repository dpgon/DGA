name: tests

on:
  push:
  pull_request:

jobs:
  tests-2021:
    # 2021 environment: the bundled model only loads with the exact versions of requirements.txt (Python 3.9)
    runs-on: ubuntu-22.04
    env:
      NLTK_DATA: ${{ github.workspace }}/.nltk_data
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache NLTK brown corpus
        uses: actions/cache@v4
        with:
          path: ${{ env.NLTK_DATA }}
          key: nltk-brown-v1

      - name: Download NLTK brown corpus
        run: |
          if [ ! -d "$NLTK_DATA/corpora/brown" ]; then
            python -m nltk.downloader -d "$NLTK_DATA" brown
          fi

      # The data files are release assets (C8), listed in ml-data/MANIFEST: a new manifest means new files
      - name: Cache data files
        uses: actions/cache@v4
        with:
          path: |
            ml-data
            DGAs/wordlist/top-1m.csv
          key: data-${{ hashFiles('ml-data/MANIFEST') }}

      - name: Download and verify data files
        run: python fetchdata.py

      - name: Run tests (without the slow ones)
        run: pytest
